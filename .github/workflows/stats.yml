name: stats

# Level-0 usage telemetry — passive, registry/GitHub-side only, no client phone-home.
#
# The snapshot is DATA, not source, and it lives on its own branch. It used to commit straight to
# main every morning, which meant any long-running local session could have its push rejected
# mid-flight — costing a manual rebase and, on a release, a voided approval. The default branch is
# now never a push target here.
#
# Collection lives in scripts/stats/snapshot.mjs (unit-tested) rather than inline bash. The rule it
# enforces: a signal that could not be READ is recorded EMPTY, never 0. The traffic endpoints need a
# token with repo access — without it this run records a gap and says so, instead of writing 48
# consecutive days of fictional zeros the way the inline collector did.
#
# To turn the traffic columns on: add a repo-scoped PAT as the secret STATS_TOKEN (the default
# GITHUB_TOKEN cannot read /traffic). Until then the views/clones badges honestly read "n/a".

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write # commit the snapshot to the data branch

concurrency:
  group: stats
  cancel-in-progress: false

env:
  STATS_BRANCH: stats

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The data branch is an ORPHAN: it carries the history and nothing else — no repo source, no
      # shared ancestry with main to merge or diverge.
      #
      # It is NOT migrated from here. The existing series was moved onto the branch once, by hand,
      # and verified before main dropped its copy — because a CI-side migration that reads a file
      # from main is a step that silently no-ops the moment main stops carrying it, which is exactly
      # when losing the data would be irreversible. This bootstrap therefore handles only the
      # genuinely-missing case: it starts a FRESH series and says so.
      - name: Check out (or create) the data branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin "$STATS_BRANCH"; then
            git worktree add .stats-data FETCH_HEAD
            git -C .stats-data checkout -B "$STATS_BRANCH"
          else
            echo "::warning title=Stats data branch missing::$STATS_BRANCH not found on origin — starting a FRESH series. Any earlier history is NOT recovered by this run."
            empty=$(git hash-object -w -t tree /dev/null)
            root=$(git commit-tree "$empty" -m "chore(stats): initialise the data branch")
            git branch "$STATS_BRANCH" "$root"
            git worktree add .stats-data "$STATS_BRANCH"
          fi

      - name: Collect the snapshot
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_REPO: ${{ github.repository }}
          STATS_DIR: .stats-data
        run: node scripts/stats/snapshot.mjs

      - name: Commit the snapshot to the data branch
        run: |
          set -euo pipefail
          cd .stats-data
          git add history.csv badge-downloads.json badge-views.json badge-clones.json
          if git diff --cached --quiet; then
            echo "no change today"
          else
            git commit -m "chore(stats): snapshot $(date -u +%F)"
            git push origin "$STATS_BRANCH"
          fi
